<header class="main-header">
  <h5>Sistema de Apoio à Decisão para Diagnóstico do Cancro da Próstata</h5>

  <nav class="nav-menu">
    <a routerLink="/calendario" class="active">Calendário</a>
    <a routerLink="/utentes">Utentes</a>
  </nav>

  <div class="user-info">
    <span class="user-icon" (click)="toggleMenu()">
      <i class="fas fa-user-circle"></i>
    </span>
    <span *ngIf="user">{{ user.nome }}</span>

    <div class="dropdown-menu" [class.show]="showMenu">
      <button (click)="logout()">
        <i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i> Sair
      </button>
    </div>
  </div>
</header>


<main class="container">
  <div class="container-card">
    <link href="https://cdn.syncfusion.com/ej2/material.css" rel="stylesheet" />

    <ejs-schedule #scheduleObj width="100%" height="550px" [selectedDate]="selectedDate" [eventSettings]="eventSettings"
      [showQuickInfo]="true" (eventRendered)="onEventRendered($event)" (popupOpen)="onPopupOpen($event)">

      <e-views>
        <e-view option="Day"></e-view>
        <e-view option="Week"></e-view>
        <e-view option="Month"></e-view>
      </e-views>
    </ejs-schedule>
  </div>
</main>
